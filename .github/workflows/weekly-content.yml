name: Weekly Content Generator

on:
  schedule:
    # 每周一早上 8 点自动运行
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create content issue
        uses: actions/github-script@v7
        with:
          script: |
            const topics = [
              'Best Programming Books 2026',
              'VS Code Tips and Tricks',
              'Free Developer Tools',
              'Best Chrome Extensions for Developers',
              'How to Learn React in 2026',
              'Best Open Source Projects to Contribute',
              'Coding Career Advice',
              'Best JavaScript Frameworks Compared'
            ];
            
            const randomTopic = topics[Math.floor(Math.random() * topics.length)];
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📝 New Article Idea: ${randomTopic}`,
              body: `
## New Content Idea

**Topic:** ${randomTopic}

### Suggested Outline
- Introduction
- Main Content
- Conclusion
- Call to Action (Affiliate Links)

### Category
- Coding / Tutorial / Reviews

---
*Auto-generated by TechPulse Content Bot*
              `
            });
            
            console.log(`Created issue for: ${randomTopic}`);
