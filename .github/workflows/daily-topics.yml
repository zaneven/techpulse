name: Daily Content Ideas

on:
  schedule:
    # 每天早上 7:30 (北京时间) = 23:30 UTC 前一天
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Get trending topics
        id: trending
        run: |
          # This would ideally call Tavily API, but for now we create a placeholder
          echo "Fetching trending topics..."
          
          # Create issue with placeholder - in production, this would call an AI API
          echo "topics_fetched=true" >> $GITHUB_OUTPUT
      
      - name: Create daily content issue
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            const topics = [
              'Best AI Tools Released This Week',
              'Trending Developer Tools',
              'New Programming Languages Gaining Popularity',
              'Tech Layoffs and Career Advice',
              'Open Source Projects Trending',
              'New VS Code Features',
              'AI Model Updates and Comparisons',
              'Cloud Platform Updates',
              'Security Vulnerabilities and Fixes',
              'Startup Funding News'
            ];
            
            const randomTopic = topics[Math.floor(Math.random() * topics.length)];
            const today = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📝 Daily Topic (${today}): ${randomTopic}`,
              body: `
## Today's Content Idea

**Topic:** ${randomTopic}

**Date:** ${today}

### Suggested Angle
- What's new/interesting about this topic?
- Why should readers care?
- Practical takeaways

### Category
- [ ] Review
- [ ] Tutorial
- [ ] News
- [ ] Career

### Affiliate Opportunities
- What products/services could be recommended?

---
*🤖 Auto-generated by TechPulse Daily Bot*
              `
            });
            
            console.log(`Created daily issue for: ${randomTopic}`);
